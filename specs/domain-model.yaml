# ==============================================================================
# File 1: domain-model.yaml
# Description: Durable domain model linking statements, records, and evidence.
# ==============================================================================

DomainModel:
  DisputeCase:
    description: "The core aggregate root representing the lifecycle of a dispute from Enquiry to Resolution."
    fields:
      caseId: "UUID"
      status: "Enum (ENQUIRY_PRE_DISPUTE, CASE_INITIATED, EVIDENCE_COLLECTION, INVESTIGATION, RESOLUTION, CLOSED)" #
      disputeCategory: "Enum (UNAUTHORIZED_CHARGES, EXCESSIVE_CHARGES, FAILURE_TO_DELIVER, DEFECTIVE_MERCHANDISE, I_DIDNT_BUY_THIS)" #
      networkRouting: "Enum (VISA, MASTERCARD, UPI, GPAY, PHONEPE)" #
      financialValue: "Decimal"
      resolutionBucket: "Enum (BUCKET_1_MINOR_STP, BUCKET_2_PROBABILISTIC, BUCKET_3_MAJOR_DETERMINISTIC)" #
      createdTimestamp: "DateTime"
      lastUpdatedTimestamp: "DateTime"
      
  Evidence:
    description: "Represents customer statements, merchant records, transaction events, receipts, delivery records, authentication events and correspondence."
    fields:
      evidenceId: "UUID"
      caseId: "UUID"
      sourceParty: "Enum (CUSTOMER, ACQUIRER, MERCHANT, BANK)" #
      evidenceType: "String (Receipt, DeliveryRecord, AuthLog, ChatTranscript)"
      contentPayload: "JSON"
      isLateArrival: "Boolean (True if submitted post-initial investigation phase)"
      version: "Integer (Explicit support for corrected or conflicting versions)" #
      provenance:
        sourceSystem: "String"
        ingestionTimestamp: "DateTime"
        cryptographicHash: "String"
        
  EventLog:
    description: "Versioned state with source-level provenance and explicit separation of recorded fact, AI inference, user input, automated action and human decision."
    fields:
      eventId: "UUID"
      caseId: "UUID"
      eventType: "Enum (RECORDED_FACT, AI_INFERENCE, USER_INPUT, AUTOMATED_ACTION, HUMAN_DECISION)" #
      eventDescription: "String"
      timestamp: "DateTime"
      actor: "String (System, Agent_UUID, Human_UUID)"
      confidenceScore: "Float (0.0 to 1.0, required if eventType is AI_INFERENCE)"
      
  Hypothesis:
    description: "Represents competing interpretations, plans or hypotheses and shows which evidence supports, weakens or changes each option without hiding uncertainty."
    fields:
      hypothesisId: "UUID"
      caseId: "UUID"
      narrativeSummary: "String"
      supportingEvidenceIds: "List<UUID>"
      weakeningEvidenceIds: "List<UUID>"
      probabilityScore: "Float"
      status: "Enum (ACTIVE, REJECTED, ACCEPTED)"