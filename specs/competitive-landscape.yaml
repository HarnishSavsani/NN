# ==============================================================================
# File: competitive-landscape.yaml
# Description: Competitive intelligence, gap analysis, and differentiation 
#              strategy for the Evidence Reconstruction & Resolution Agent.
# ==============================================================================

competitor_profiles:
  - name: "Pega Smart Dispute Agentic Automation"
    category: "Enterprise BPM / Bank Back-Office"
    target_customers: 
      - "Issuing Banks"
      - "Acquiring Banks"
    business_model_pricing: "Enterprise Software Licensing / Subscription"
    technology_approach: 
      - "Rules-driven BPM (Business Process Management) built on Pega Constellation"
      - "Process AI for routing and prediction scores"
      - "Doc AI for OCR and document verification"
      - "Knowledge Buddy using RAG for internal policy queries"
      - "API integrations with Visa VROL and Mastercard MasterCom"
    core_capabilities_strengths:
      - "End-to-end lifecycle management for Visa, Mastercard, Zelle, and ACH"
      - "In-built compliance rules (Reg E, Reg Z, Section 75)"
      - "Supports straight-through processing (STP) for low-value claims"
    weaknesses_and_gaps:
      - "Architecturally rigid: Built on flowchart-based case management rather than event-sourced temporal logic."
      - "Late Evidence Handling: Struggles with out-of-band, asynchronous evidence updates (like the 'National Finale Inject'). Requires manual workflow resets or complex exceptions."
      - "Contradiction Engine: Uses AI to summarize, but lacks dynamic defeasible reasoning (automatically invalidating prior assumptions when new conflicting facts emerge)."

  - name: "Chargeflow Automation"
    category: "Merchant Dispute Representment SaaS"
    target_customers: 
      - "E-commerce Merchants"
    business_model_pricing: "Success-based (e.g., fee on recovered revenue) / API-driven"
    technology_approach: 
      - "Agentic dispute representment API"
      - "AI experiments to optimize evidence for each dispute"
      - "Data ingestion, enrichment, and automated evidence creation"
    core_capabilities_strengths:
      - "Ingests disputes from connected PSPs, automatically assembles evidence packages, and submits network responses"
      - "Generates claims from scratch rather than relying on static templates"
    weaknesses_and_gaps:
      - "One-Sided Advocacy: Designed purely to fight chargebacks on behalf of merchants, lacking the unbiased truth-seeking mandate required by banks."
      - "No Human-in-the-Loop Liability: Highly automated, missing the role-based approval gates and explicit human liability ownership required by financial regulators."

  - name: "Chargeblast"
    category: "Pre-Dispute Deflection & Alerts SaaS"
    target_customers: 
      - "Merchants"
    business_model_pricing: "Pay-per-alert (Plans start at $19/mo, $14 per deflection, 15% fee on recovery wins)"
    technology_approach: 
      - "Webhook interception via network alerts (Ethoca/Verifi)"
      - "Automated workflows and custom rules"
    core_capabilities_strengths:
      - "Stops fraudulent disputes before they reach the issuer via pre-dispute alerts and auto-refunds"
      - "Setup in under a week with a clean dashboard unifying alerts and disputes"
    weaknesses_and_gaps:
      - "Resolution Avoidance: It prevents chargebacks via auto-refunds rather than performing deep evidence reconciliation on complex factual disputes."
      - "Lacks Complex Investigation: Not suited for resolving nuanced 'Item Not Received' disputes requiring unstructured data parsing across competing narratives."

  - name: "NPCI UDIR (Unified Dispute and Issue Resolution)"
    category: "Network-Level Clearing Switch Protocol"
    target_customers: 
      - "Banks"
      - "PSPs (Google Pay, PhonePe, Paytm)"
    business_model_pricing: "Network utility (regulated utility pricing)"
    technology_approach: 
      - "API-based real-time communication"
      - "Continuous polling of participating banks"
      - "Automated fund movement decisions"
    core_capabilities_strengths:
      - "Centralized network for arbitration between customers and merchants in the UPI ecosystem"
      - "Automated, single-channel redressal system enforcing strict timeouts (e.g., auto-chargeback on T+1 for P2P if no response)"
      - "Triggers instant auto-reversals without manual bank intervention"
    weaknesses_and_gaps:
      - "Structured Data Only: Highly effective for ledger matching (e.g., duplicate processing) but cannot handle subjective, unstructured evidence (photos, emails, chat transcripts)."
      - "No AI Investigative Workspace: It is a routing and execution rail, not an operational interface for human specialists to untangle conflicting stories."

