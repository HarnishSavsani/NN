# ==============================================================================
# File: ui-spec.yaml
# Description: Complete UI Architecture & Design System Specification for the
#              Evidence Reconstruction & Resolution Agent.
# Stack: React, Tailwind CSS, shadcn/ui, Lucide Icons, Framer Motion.
# ==============================================================================

ui_specification:
  meta:
    app_name: "ResolutionOS"
    design_philosophy: "Calm, Professional, Trustworthy, Auditable, Data-Dense"
    target_environment: "Desktop/Tablet Web Application"

  # ----------------------------------------------------------------------------
  # 1. DESIGN PRINCIPLES & TOKENS (TAILWIND CONFIG)
  # ----------------------------------------------------------------------------
  design_system:
    principles:
      trust_through_clarity: "Never hide the source of data. AI inferences must look distinctly different from cryptographic facts."
      defensible_actions: "Every 'Approve' or 'Reject' button must be accompanied by the 'Why' directly above it."
      calm_urgency: "Use color sparingly. Red/Amber is reserved ONLY for contradictions, SLA breaches, or regulatory warnings."
    
    color_tokens:
      background: "bg-slate-50 (Light, low eye-strain for operators)"
      surface: "bg-white border-slate-200"
      typography:
        primary: "text-slate-900"
        secondary: "text-slate-500"
        mono: "font-mono text-slate-600 (Used for IDs, Timestamps, Hash values)"
      semantic_provenance:
        fact_system: "bg-blue-50 text-blue-700 border-blue-200 (e.g., Visa Network Log)"
        fact_human: "bg-slate-100 text-slate-700 border-slate-300 (e.g., Customer Statement)"
        ai_inference: "bg-purple-50 text-purple-700 border-purple-200 (e.g., Confidence Score, Hypothesis)"
      status:
        contradiction: "bg-rose-50 text-rose-700 border-rose-200"
        resolved: "bg-emerald-50 text-emerald-700 border-emerald-200"

  # ----------------------------------------------------------------------------
  # 2. COMPONENT INVENTORY (MAPPED TO SHADCN/UI)
  # ----------------------------------------------------------------------------
  component_mapping:
    layout:
      - "Resizable (shadcn): For the 3-pane case workspace."
      - "ScrollArea (shadcn): For the infinite vertical event timeline."
      - "Tabs (shadcn): Switching between Case Details, Audit Replay, and Raw JSON views."
    data_display:
      - "HoverCard (shadcn): CRUCIAL for provenance. Hovering any fact reveals its timestamp, source, and hash."
      - "Badge (shadcn): Denoting AI confidence (e.g., 'High Confidence 94%') and Event Types."
      - "Accordion (shadcn): Collapsing verbose merchant terms of service or full chat transcripts."
      - "Table (shadcn): For tabular transaction logs and value-stream matching."
    feedback_and_interaction:
      - "Alert (shadcn): For 'Late Evidence Inject' and contradiction warnings."
      - "Toast (shadcn/sonner): Ephemeral notifications for async system events."
      - "Dialog (shadcn): For high-liability approval gates requiring MFA or signature."
    custom_extensions:
      - "ContradictionGraph: A custom D3.js or React Flow component showing competing nodes."
      - "TimeTravelScrubber: A range slider mapping to historical timestamps for Audit Replay."

  # ----------------------------------------------------------------------------
  # 3. INFORMATION ARCHITECTURE
  # ----------------------------------------------------------------------------
  information_architecture:
    global_navigation:
      type: "Left Sidebar (Collapsed by default to maximize horizontal workspace)"
      items:
        - "Active Queue (Sorted by SLA / Reg E deadlines)"
        - "My Investigations"
        - "Awaiting Merchant"
        - "Approvals (Supervisor only)"
    local_navigation_case_view:
      type: "Top Header Breadcrumb & Status Bar"
      elements:
        - "Case ID (Copy to clipboard)"
        - "Dispute Category Badge (e.g., 'Visa 13.1 - Item Not Received')"
        - "Countdown Timer (e.g., '48h to Provisional Credit SLA')"
        - "Saga Status Tracker (e.g., 'Network Call: Pending')"

  # ----------------------------------------------------------------------------
  # 4. CORE SCREENS & LAYOUTS
  # ----------------------------------------------------------------------------
  core_screens:
    workspace_3_pane_layout:
      description: "The primary operational view. Designed to eliminate tab-switching."
      
      left_pane_evidence_timeline:
        width: "25%"
        components:
          - "Vertical Timeline using customized shadcn Cards."
          - "Filters: [All] [Facts Only] [AI Only] [User Actions]."
          - "Visuals: Each card has a left-border color mapped to semantic_provenance."
          
      center_pane_narrative_comparison:
        width: "50%"
        components:
          - "Tabs: [Contradiction Matrix] [Hypothesis Board] [Raw Documents]"
          - "Split-Screen Layout: Customer Narrative (Left) vs. Merchant Evidence (Right)."
          - "Gap Highlight: Missing evidence is represented as an empty dashed block (e.g., 'Missing: Courier Signature')."
          
      right_pane_action_copilot:
        width: "25%"
        components:
          - "Current Recommended Action (shadcn Card with purple AI styling)."
          - "Supporting Arguments list."
          - "Action Buttons (Primary: Approve, Secondary: Request Info, Destructive: Reject)."
          - "Idempotency Lock: Buttons disable and show a spinner immediately on click."

    audit_replay_view:
      description: "Supervisor/Compliance view to reconstruct historical system state."
      layout:
        - "Top: 'TimeTravelScrubber' Slider spanning Case Creation to Current Time."
        - "Main: Read-only version of the 3-pane workspace."
        - "Interaction: Dragging the slider dynamically mounts/unmounts timeline events and recalculates the 'Historical AI Hypothesis' as it existed at time T."

  # ----------------------------------------------------------------------------
  # 5. DETAILED INTERACTION PATTERNS
  # ----------------------------------------------------------------------------
  interaction_patterns:
    late_evidence_injection_flow:
      scenario: "Merchant uploads a delivery photo asynchronously on Day 14."
      step_1_notification: 
        - "shadcn Toast appears: '⚠️ New Material Evidence: Merchant Representment Received'."
      step_2_visual_interruption:
        - "Center pane instantly prepends a prominent shadcn Alert (destructive variant)."
        - "Title: 'Liability Shift Detected: Contradiction in Hypothesis'."
        - "Body: 'Late delivery receipt contradicts customer claim of non-delivery.'"
      step_3_state_retraction:
        - "The previous AI Next-Best-Action (e.g., 'Approve Refund') receives a visual strike-through line and fades to 50% opacity."
        - "A new Action Card generates above it: 'Review Contradictory Evidence'."
      step_4_timeline_update:
        - "Left pane appends the new event. It does NOT delete the old assumption, preserving defeasible reasoning."

    uncertainty_and_confidence_visualization:
      pattern: "Never display a naked probability. Always pair it with evidence weight."
      ui_execution:
        - "Use shadcn Progress bar for hypothesis probability."
        - "Hovering the Progress bar opens a Tooltip: 'Based on 3 supporting facts, 1 weakening fact. 8% gap due to missing IP log'."

    provenance_surfacing:
      pattern: "Ubiquitous Tooltips (shadcn HoverCard)."
      ui_execution:
        - "Every piece of text extracted by the AI has a dotted underline."
        - "Hovering reveals: 'Extracted by DocAI at 14:02:11 | Source: FedEx_Receipt.pdf | Confidence: 99% | Cryptographic Hash: a7f8b9...'"

    approval_gates:
      pattern: "Two-step verification for financial execution."
      ui_execution:
        - "If Specialist clicks 'Execute Reversal' > $1,000 threshold."
        - "shadcn Dialog opens: 'Supervisor Authorization Required. Action exceeds limit.' with a dropdown to select a Supervisor for routing."

  # ----------------------------------------------------------------------------
  # 6. UI STATES (LOADING, EMPTY, ERROR, PARTIAL)
  # ----------------------------------------------------------------------------
  ui_states:
    loading_states:
      pattern: "Skeletal loaders (shadcn Skeleton) matching the exact dimensions of the expected data to prevent layout shift."
    empty_states:
      pattern: "Illustrative + Call to Action."
      example: "Hypothesis Board empty? Show dashed outline box with text 'Waiting for merchant counter-evidence...' and a button to 'Manually Ping Merchant API'."
    partial_data_states:
      pattern: "Explicitly denote missing but expected data."
      example: "If UPI provider logs are delayed, display a greyed-out shadcn Card in the evidence timeline labeled: 'UPI Telemetry Log - Pending Async Delivery'."
    error_states:
      pattern: "Graceful degradation with retry mechanisms."
      example: "If network API fails during action execution: shadcn Alert (destructive) 'Network Timeout. Saga State Saved. [Retry Action]'."

  # ----------------------------------------------------------------------------
  # 7. ACCESSIBILITY (A11Y) & RESPONSIVENESS
  # ----------------------------------------------------------------------------
  accessibility_and_responsiveness:
    a11y:
      - "All UI components follow WAI-ARIA standards (built-in via shadcn/Radix UI)."
      - "High contrast ratios for text (e.g., text-slate-500 on bg-slate-50 meets AA standards)."
      - "Keyboard navigability: Operators can press 'Tab' to move through timeline events and 'Enter' to open HoverCards."
      - "Screen reader support: 'Late Evidence Inject' triggers an `aria-live=\"assertive\"` region update so visually impaired operators are instantly notified of state changes."
    responsive_design:
      - "Primary target is Desktop (1080p+), as multi-pane investigation is data-heavy."
      - "On Tablets (md: breakpoint), Right Pane (Next-Best-Action) collapses into a bottom sticky sheet (shadcn Sheet)."
      - "Mobile is completely out of scope for the Investigation Workspace (handled via graceful error message: 'Please use desktop for operational tasks')."