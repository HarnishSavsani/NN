services:
  # -------------------------------------------------------------
  # LiteLLM Proxy (Router & Gateway)
  # -------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm_proxy
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # Database connection
      DATABASE_URL: "postgresql://admin:nexus%21123@db:5432/litellm"
      STORE_MODEL_IN_DB: "True"

      # Authentication
      LITELLM_MASTER_KEY: "sk-nexus!123"
      LITELLM_SALT_KEY: "4e657572616c4e6578757353616c7432303236303030303030303030303030303030"
      UI_USERNAME: "admin"
      UI_PASSWORD: "nexus!123"

      # Langfuse Integration
      LITELLM_SUCCESS_CALLBACKS: '["langfuse"]'
      LITELLM_FAILURE_CALLBACKS: '["langfuse"]'
      LANGFUSE_HOST: "http://langfuse-server:3000"
      
      # Step 1 Placeholders: update after signing into Langfuse
      LANGFUSE_SECRET_KEY: "sk-lf-de008c11-f9ad-4b59-a8cd-bd7d515f9183"
      LANGFUSE_PUBLIC_KEY: "pk-lf-b66d9739-f488-4307-aab8-3be6b58068a7"
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4000"
    depends_on:
      db:
        condition: service_healthy
      langfuse-server:
        condition: service_started

  # -------------------------------------------------------------
  # Langfuse Server & Worker
  # -------------------------------------------------------------
  langfuse-server:
    image: ghcr.io/langfuse/langfuse:3
    container_name: langfuse_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://admin:nexus%21123@db:5432/langfuse"
      DIRECT_URL: "postgresql://admin:nexus%21123@db:5432/langfuse"

      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://default:nexus!123@clickhouse:9000/default"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: "nexus!123"
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      REDIS_URL: "redis://redis:6379"

      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: "us-east-1"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "admin"
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "nexus!123"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

      AUTH_DISABLE_SIGNUP: "false"
      AUTH_DISABLE_USERNAME_PASSWORD: "false"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "4e657572616c4e6578757353616c7432303236303030303030303030303030303030"
      SALT: "4e657572616c4e6578757353616c7432303236303030303030303030303030303030"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      TELEMETRY_ENABLED: "false"

  langfuse-worker:
    image: ghcr.io/langfuse/langfuse-worker:3
    container_name: langfuse_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://admin:nexus%21123@db:5432/langfuse"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://default:nexus!123@clickhouse:9000/default"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: "nexus!123"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_URL: "redis://redis:6379"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: "us-east-1"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "admin"
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "nexus!123"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      SALT: "4e657572616c4e6578757353616c7432303236303030303030303030303030303030"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      TELEMETRY_ENABLED: "false"

  # -------------------------------------------------------------
  # Shared PostgreSQL
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: shared_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: nexus!123
      POSTGRES_DB: langfuse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # ClickHouse, Redis, and MinIO
  # -------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: langfuse_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: nexus!123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: langfuse_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: langfuse_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: nexus!123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc:latest
    container_name: langfuse_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin nexus!123;
      /usr/bin/mc mb --ignore-existing myminio/langfuse;
      exit 0;
      "

volumes:
  pgdata:
  clickhouse_data:
  minio_data:
